name: Publish test container

on:
  push:
    branches: [main, develop]
    paths:
      - docker/test_img/**
      - .github/workflows/test-container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/test_img
          file: docker/test_img/Dockerfile
          push: true
          tags: |
            ghcr.io/coe-marble/rpp-test-container:lyrical-ubuntu26.04-capnp1.1.0-v1
            ghcr.io/coe-marble/rpp-test-container:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

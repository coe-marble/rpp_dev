name: Submodule CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  submodule-ci:
    name: Submodule CI
    environment: delayed-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Check CI for pinned submodule commits
        env:
          GH_TOKEN: ${{ secrets.RPP_CI_TOKEN || github.token }}
        run: python3 .github/scripts/submodule_ci.py

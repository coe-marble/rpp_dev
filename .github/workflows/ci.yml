name: Integration Python tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.RPP_CI_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          for package in src/rpp_common src/rpp_plugin_registrator src/rpp_orchestrator src/rpp_py src/rpp_cli src/rpp_testing; do
            python -m pip install --no-deps -e "$package"
          done
          python -m pip install -e "src/rpp_cli[test]"
      - name: Run Python unit tests
        run: python -m pytest src/rpp_cli/tests src/rpp_orchestrator/tests
